name: sellstory
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Version is managed by Xcode for iOS builds
# This version should match the iOS version in Xcode
version: 1.10.8+12

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # GetX for state management, dependency injection, and routing
  get: ^4.6.6
  
  # HTTP client
  dio: ^5.4.0
  
  # Kanban board for drag and drop
  appflowy_board: ^0.1.2
  # Alternative drag and drop package
  drag_and_drop_lists: ^0.4.2
  
  # Localization
  intl: ^0.20.2
  
  # Local storage
  get_storage: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Logging
  logger: ^2.6.1
  
  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_database: ^11.1.4
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1
  
  # Messaging and device info
  firebase_messaging: ^15.0.4
  device_info_plus: ^10.1.0
  # Analytics (GA4)
  firebase_analytics: ^11.0.0

  # Time formatting
  timeago: ^3.7.0

  # Device preview for testing different screen sizes and orientations
  device_preview: ^1.3.1

  # HTTP client for API calls
  http: ^1.1.0

  # Image picker for chat attachments
  image_picker: ^1.0.4

  # File picker for chat attachments
  file_picker: ^8.0.0+1

  # URL launcher for opening links
  url_launcher: ^6.2.1

  # SVG support for custom icons
  flutter_svg: ^2.0.10+1

  # WebView support
  webview_flutter: ^4.7.0

  # Image processing for resizing
  image: ^4.1.3

  # Indexed list scrolling to focus items by index
  scrollable_positioned_list: ^0.3.8

  # In-app media viewers
  video_player: ^2.9.2
  audioplayers: ^6.0.0
  pdfx: ^2.6.0
  # video_thumbnail: ^0.5.6

  # Slidable list item actions
  flutter_slidable: ^3.1.0

  # Brand icons (Facebook, Instagram, LINE)
  font_awesome_flutter:

dev_dependencies:
  flutter_test:
    sdk: flutter


  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  
  # Mocking library for testing
  mocktail: ^1.0.3
  
  # Native splash screen generation
  flutter_native_splash: ^2.4.1
  
  # App launcher icon generation
  flutter_launcher_icons: ^0.14.1

# Native splash screen configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_logo.png
  color_dark: "#000000"
  image_dark: assets/splash_logo.png
  android_gravity: center
  ios_content_mode: center

# App launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon_fixed.png
  # Optional: Android adaptive icon for better look on newer Android
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon_fixed.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Platform-specific configuration
platforms:
  android:
  ios:

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/splash_logo.png
    - assets/sellstory_logo.png
    - assets/google_icon.png
    - assets/app_icon_original.png
    - assets/app_icon_fixed.png
    - assets/icons/

  # Custom fonts
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt/Prompt-Thin.ttf
          weight: 100
        - asset: assets/fonts/Prompt/Prompt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Prompt/Prompt-Light.ttf
          weight: 300
        - asset: assets/fonts/Prompt/Prompt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Prompt/Prompt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Prompt/Prompt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Prompt/Prompt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Prompt/Prompt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Prompt/Prompt-Black.ttf
          weight: 900
        - asset: assets/fonts/Prompt/Prompt-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Prompt/Prompt-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Prompt/Prompt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Prompt/Prompt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Prompt/Prompt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Prompt/Prompt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Prompt/Prompt-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Prompt/Prompt-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Prompt/Prompt-BlackItalic.ttf
          weight: 900
          style: italic

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
